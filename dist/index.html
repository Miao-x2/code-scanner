<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#112438"><title>扫码与打印</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="mark">▥</div><h1>扫码与打印</h1></header><section class="grid"><article class="panel"><h2>扫描条形码 / 二维码</h2><div class="view"><video id="video" playsinline muted></video><span id="empty">点击下方按钮开启相机</span></div><div class="actions"><button id="start">开启扫描</button><button class="secondary" id="stop">停止</button><label class="fileButton" for="photo">选择照片<input id="photo" type="file" accept="image/*"></label><label class="fileButton" for="cameraPhoto">拍照识别<input id="cameraPhoto" type="file" accept="image/*" capture="environment"></label></div><p id="scanStatus" role="status">相机仅用于本机识别。</p><label>识别结果<textarea id="result" readonly placeholder="扫描结果会显示在这里"></textarea></label><button class="secondary" id="copy">复制结果</button></article><article class="panel"><h2>生成可打印标签</h2><label>类型<select id="kind"><option value="qr">二维码</option><option value="bar">条形码（Code 39）</option></select></label><label>输入内容<textarea id="content" placeholder="例如网址、文字或商品编号"></textarea></label><p class="hint" id="formatHint">二维码支持中文、网址和普通文字。</p><div class="actions"><button id="generate">生成</button><button class="secondary" id="print">保存 PDF / 打印</button></div><div id="preview" class="preview"><span>输入内容后点击生成</span></div><p id="genStatus" role="status"></p></article></section><footer>打印窗口中可选择打印机，或选择“另存为 PDF”。扫描与生成均在本机完成。</footer></main><script src="app.js"></script></body></html>
